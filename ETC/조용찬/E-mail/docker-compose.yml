version: '3.8'

services:
      # --- 1. 관리자 포털 (PHP로 변경) ---
    admin_entry:
      build: ./admin_src
      container_name: admin_entry
      ports:
        - "8003:80"
      volumes:
        - ./admin_src:/var/www/html
        - ./mail_data:/mailstore
      extra_hosts:
        - "host.docker.internal:host-gateway"
      environment:
        DB_HOST: host.docker.internal
        DB_NAME: admin_portal
        DB_USER: portal_user
        DB_PASS: StrongPortalPass!123
        IMAP_HOST: mail_server
        IMAP_PORT: 143
        MAILSTORE_BASE: /mailstore
      networks:
        sme_internal_network:
          ipv4_address: 192.168.20.40

# --- 2. A 고객사 (OWASP Juice Shop) ---
    client_a_owasp:
      build:
        context: ./client_a_juice_src
      container_name: client_a_owasp
      image: client_a_owasp
      ports:
        - "8000:3000"
      extra_hosts:
        - "admin.local:192.168.20.40"
        - "keyserver.local:192.168.20.50"
      environment:
        SMTP_HOST: mail_server
        SMTP_PORT: 25
        MAIL_FROM: shop@company.local
        MAIL_TO: support@company.local
        MAIL_SUBJECT: "Client A Notification"
        MAIL_BODY: "hello from client_a"
      volumes:
        - ./mail_tools/send_test_mail.js:/tmp/send_test_mail.js:ro

      networks:
        sme_internal_network:
          ipv4_address: 192.168.20.10

    # --- 3. B 고객사 (DVWA) --
    client_b_dvwa:
      image: sagikazarmark/dvwa
      container_name: client_b_dvwa
      ports:
        - "8001:80"                       
      environment:
        SMTP_HOST: mail_server
        SMTP_PORT: 25
        MAIL_FROM: security@company.local
        MAIL_TO: it.admin@company.local
        MAIL_SUBJECT: "Client B Security Alert"
        MAIL_BODY: "hello from client_b"
      volumes:
        - ./mail_tools/send_test_mail.php:/tmp/send_test_mail.php:ro
      networks:
        sme_internal_network:
         ipv4_address: 192.168.20.20
                                                                                                                            # --- 4. C 고객사 (bWAPP) ---
    client_c_bwapp:
      image: raesene/bwapp
      container_name: client_c_bwapp
      ports:
        - "8002:80"
      environment:
        SMTP_HOST: mail_server
        SMTP_PORT: 25
        MAIL_FROM: system@company.local
        MAIL_TO: ceo@company.local
        MAIL_SUBJECT: "Client C System Alert"
        MAIL_BODY: "hello from client_c"
      volumes:
        - ./mail_tools/send_test_mail.php:/tmp/send_test_mail.php:ro
      networks:
        sme_internal_network:
          ipv4_address: 192.168.20.30

    # --- Client C DB (MySQL) ---
    client_c_db:
      image: mysql:5.7
      container_name: client_c_db
      command: --default-authentication-plugin=mysql_native_password
      environment:
        MYSQL_ROOT_PASSWORD: rootpw
        MYSQL_DATABASE: bwapp
        MYSQL_USER: bwapp
        MYSQL_PASSWORD: bwapppw
      volumes:
        - client_c_mysql_data:/var/lib/mysql
      networks:
        sme_internal_network:
          ipv4_address: 192.168.20.31
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw"]
        interval: 10s
        timeout: 5s
        retries: 10
   
    # --- 5. 암호키 서버 (최종 목표) ---
    key_vault_server:
      image: hashicorp/vault:latest
      container_name: key_vault_server
      ports:
        - "8200:8200"
      environment:
        - 'VAULT_DEV_ROOT_TOKEN_ID=my_root_token' # [보안취약점] KISA 가이드의 취약한 기본 인증 (Source: 8470)
        - 'VAULT_ADDR=http://127.0.0.1:8200'
      cap_add:
        - IPC_LOCK
      networks:
        sme_internal_network:
          ipv4_address: 192.168.20.50

    # mail_server
    mail_server:
      build: ./mail_src
      container_name: mail_server
      hostname: mail.company.local
      ports:
        - "2525:25"
        - "2587:587"
        - "2143:143"
      volumes:
        - ./mail_data:/var/mail/vhosts
      extra_hosts:
        - "host.docker.internal:host-gateway"
      networks:
        sme_internal_network:
          ipv4_address: 192.168.20.60
 
volumes:
  client_c_mysql_data:

networks:
  sme_internal_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24